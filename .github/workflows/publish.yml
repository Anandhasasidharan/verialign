name: Publish to PyPI

# Release by pushing a tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens are stored in the repo.
# One-time setup: register a pending publisher on TestPyPI and PyPI for
#   owner: Anandhasasidharan  repo: verialign  workflow: publish.yml
#   environments: testpypi and pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: Guard against shipping local state
        run: |
          set -e
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)\.env$|\.sqlite3$|\.db$'; then
            echo "Refusing to publish: sdist contains local state";
            exit 1;
          fi

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/verialign
    permissions:
      id-token: write # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verialign
    permissions:
      id-token: write # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
