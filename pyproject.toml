[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verialign"
description = "OpenAI-compatible verification support proxy for LLM outputs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anandhasasidharan" }]
keywords = [
    "llm",
    "hallucination",
    "verification",
    "grounding",
    "proxy",
    "openai",
    "nli",
    "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Anandhasasidharan/verialign"
Repository = "https://github.com/Anandhasasidharan/verialign"
Issues = "https://github.com/Anandhasasidharan/verialign/issues"

[project.scripts]
verialign = "verialign.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "textual>=0.80",
    "build>=1.2.0",
    "twine>=5.1.0",
    "alembic>=1.13",
]
async = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
]
valkey = ["valkey>=6.0.0"]
sentry = ["sentry-sdk>=2.0.0"]
otel = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.50.0",
]
nli = [
    "transformers>=4.47.0",
    "torch>=2.0.0",
]
# Semantic near-match cache + claim-conditioned re-scoring (embedding similarity).
semantic = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
]
# Interactive terminal verification console.
tui = ["textual>=0.80"]
# Streamlit trace dashboard.
dashboard = [
    "streamlit>=1.35",
    "pandas>=2.0",
]
migrate = ["alembic>=1.13"]
all = [
    "verialign[async,valkey,sentry,otel,nli,semantic,tui,dashboard,migrate]",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["verialign*"]

[tool.setuptools.package-data]
"verialign.migrations" = ["script.py.mako"]

[tool.setuptools.dynamic]
version = { attr = "verialign.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
