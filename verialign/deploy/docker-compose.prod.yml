version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verialign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: verialign
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verialign"]
      interval: 10s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      retries: 5

  proxy:
    build:
      context: ../..
      dockerfile: verialign/deploy/Dockerfile
    environment:
      VERIALIGN_DATABASE_URL: postgresql+asyncpg://verialign:${POSTGRES_PASSWORD:-change-me}@postgres:5432/verialign
      VERIALIGN_VALKEY_URL: valkey://valkey:6379/0
      VERIALIGN_UPSTREAM_BASE_URL: ${VERIALIGN_UPSTREAM_BASE_URL}
      VERIALIGN_UPSTREAM_API_KEY: ${VERIALIGN_UPSTREAM_API_KEY}
      VERIALIGN_PROXY_API_KEY: ${VERIALIGN_PROXY_API_KEY}
      VERIALIGN_REQUIRE_PROXY_AUTH: "true"
      VERIALIGN_ADMIN_API_KEY: ${VERIALIGN_ADMIN_API_KEY}
      VERIALIGN_CORS_ALLOWED_ORIGINS: ${VERIALIGN_CORS_ALLOWED_ORIGINS:-https://your.domain}
      VERIALIGN_RESPONSE_POLICY: ${VERIALIGN_RESPONSE_POLICY:-warn}
      VERIALIGN_BLOCK_THRESHOLD: ${VERIALIGN_BLOCK_THRESHOLD:-0.55}
      VERIALIGN_REDACT_TRACES: "true"
      VERIALIGN_SENTRY_DSN: ${VERIALIGN_SENTRY_DSN:-}
      VERIALIGN_ENABLE_OTEL: ${VERIALIGN_ENABLE_OTEL:-false}
      VERIALIGN_MAX_REQUEST_BODY_SIZE: "10485760"
      VERIALIGN_PROXY_TIMEOUT_SECONDS: "120"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: >
      sh -c "alembic upgrade head && uvicorn verialign.proxy.main:app --host 0.0.0.0 --port 8000 --workers 4"

  dashboard:
    build:
      context: ../..
      dockerfile: verialign/deploy/Dockerfile.dashboard
    environment:
      VERIALIGN_DATABASE_URL: postgresql+asyncpg://verialign:${POSTGRES_PASSWORD:-change-me}@postgres:5432/verialign
      VERIALIGN_DB_PATH: /data/verialign.sqlite3
    depends_on:
      - proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
